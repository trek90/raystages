[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raystages"
version = "0.1.0"
description = "Bounded, multi-stage Ray pipelines for independent items"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
ray = ["ray>=2.49,<3"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["raystages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
